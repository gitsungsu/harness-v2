[project]
name = "harness"
version = "0.2.0"
description = "Planner → Generator → Evaluator 사이클로 프로젝트를 만드는 claude CLI 하네스"
readme = "README.md"
authors = [
    { name = "gitsungsu", email = "tjdtn1939@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harness = "harness.run:cli"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
