# 에이전트별 CLI·모델·추론 강도(effort)를 여기서만 관리합니다.
# 다른 파일을 쓰려면 환경변수 AGENTS_CONFIG=경로 (평가셋 비교 실험 등).
#
# backend: "claude"(기본) | "codex". codex를 쓰려면 codex CLI가 설치·로그인돼 있어야 합니다.
# model  : 고정 모델 ID 권장. 별칭(opus 등)은 시점에 따라 가리키는 모델이 바뀝니다. 생략하면 CLI 기본값.
# effort : low | medium | high | xhigh | max (codex는 ultra도 가능). 생략하면 CLI 기본값.
# 허용 섹션: bootstrap(PRD 대화형 작성, claude만 가능), planner, generator, evaluator
#
# codex 주의: 도구별 허용 목록이 없고 샌드박스(workspace-write)만 있습니다.
#   planner/evaluator가 codex면 run.py가 docs/ 밖 변경을 사후에 검사해 위반 시 중단합니다.
#   codex CLI가 오래되면 새 모델 ID를 "지원하지 않는다"고 거부합니다. 그땐 npm i -g @openai/codex@latest.

[bootstrap]
model = "claude-opus-5-5"
effort = "high"

[planner]
model = "claude-opus-5-5"
effort = "high"

[generator]
model = "claude-sonnet-5-5"
effort = "medium"

# Generator(Claude)와 다른 계열이라 자기 코드를 후하게 채점하는 편향이 가장 작습니다.
[evaluator]
backend = "codex"
model = "gpt-6.1-sol"
effort = "high"
